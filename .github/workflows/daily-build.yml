name: Weekly Build & Release
run-name: Weekly Build & Release

on:
  schedule:
    # 每周一北京时间 03:00 = UTC 周一 19:00
    # 免费额度 2000 分钟/月，全量 4 台约 8-16h，每周一次最稳妥
    - cron: '0 19 * * 1'
  workflow_dispatch:
    inputs:
      model:
        required: false
        description: Device model (empty = all)
        type: string
        default: ""
      attempt:
        required: false
        description: Retry attempt number (internal)
        type: string
        default: "1"

# 云端自驱动链需要 actions:write（触发下一台/重试）+ contents:write（发布 Release）
permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        model:
          - jdcloud_ipq60xx_immwrt
          - qihoo_360t7-daed_immwrt
          - qihoo_360t7-nikki_immwrt
          - x64_immwrt
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Skip check for workflow_dispatch model filter
        id: skip
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # 定时触发只负责发起串行链，本 run 不做实际编译（避免 4 台并行）
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.model }}" && "${{ inputs.model }}" != "${{ matrix.model }}" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Schedule Entry (chain start)
        if: ${{ github.event_name == 'schedule' && matrix.model == 'jdcloud_ipq60xx_immwrt' }}
        shell: bash
        run: |
          echo "每周定时轮次开始，从 AX6600 发起串行链"
          gh workflow run daily-build.yml -f model=jdcloud_ipq60xx_immwrt -f attempt=1 --repo "$GITHUB_REPOSITORY"

      - name: Free Disk Space
        if: steps.skip.outputs.skip == 'false'
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo -E apt-get autoremove --purge -y || true
          sudo -E apt-get clean || true
          df -hT

      - name: Build System Setup
        if: steps.skip.outputs.skip == 'false'
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq install clang llvm
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        if: steps.skip.outputs.skip == 'false'
        uses: actions/checkout@v7.0.0

      - name: Set Build Date and Timezone
        if: steps.skip.outputs.skip == 'false'
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./wrt_core/compilecfg/${{ matrix.model }}.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> $GITHUB_ENV

      - name: Pre Clone
        if: steps.skip.outputs.skip == 'false'
        run: ./wrt_core/pre_clone_action.sh ${{ matrix.model }}

      - name: Restore Cache
        id: cache-restore
        if: steps.skip.outputs.skip == 'false'
        uses: actions/cache/restore@v4.2.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.model }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ matrix.model }}-${{ hashFiles('**/repo_flag') }}-
            ${{ matrix.model }}-

      - name: Refresh the cache
        if: steps.skip.outputs.skip == 'false'
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Build Firmware
        if: steps.skip.outputs.skip == 'false'
        run: ./build.sh ${{ matrix.model }}

      - name: Get Kernel Version
        if: steps.skip.outputs.skip == 'false'
        run: |
          echo "KVER=$(grep -oP "^kernel.*" ./firmware/*.manifest 2>/dev/null | grep -oP "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}" | head -1)" >> $GITHUB_ENV

      - name: Package Kmods
        if: steps.skip.outputs.skip == 'false'
        run: |
          if [ ! -d "./action_build/bin" ]; then
            echo "kmod source directory not found: ./action_build/bin" >&2
            exit 1
          fi
          KMOD_LIST=$(mktemp)
          trap 'rm -f "$KMOD_LIST"' EXIT
          (
            cd ./action_build/bin
            find . -type f \( -name "kmod*.ipk" -o -name "kmod*.apk" \) -print | sort > "$KMOD_LIST"
          )
          if [ ! -s "$KMOD_LIST" ]; then
            echo "No kmod packages found under ./action_build/bin" >&2
            exit 1
          fi
          kmod_count=$(wc -l < "$KMOD_LIST" | tr -d '[:space:]')
          archive_name="kmods_${{ matrix.model }}_${KVER:-unknown-kernel}_${BUILD_DATE}.tar.gz"
          tar -C ./action_build/bin -czf "$archive_name" -T "$KMOD_LIST"
          echo "KMOD_ARCHIVE=$archive_name" >> "$GITHUB_ENV"
          echo "Packaged $kmod_count kmod packages into $archive_name"

      - name: Prepare Release Body
        if: steps.skip.outputs.skip == 'false'
        run: |
          echo "每日云编译发布" > release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.1.1" >> release_body.txt
          echo "KMOD归档: ${KMOD_ARCHIVE}" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest 2>/dev/null | awk -F":" '{print $NF}' | sort -u)" >> release_body.txt

      - name: Release Firmware
        if: steps.skip.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ matrix.model }}
          files: |
            ./firmware/*.*
            ./kmods_*.tar.gz
          fail_on_unmatched_files: true
          body_path: ./release_body.txt

      # 失败也保存缓存：OpenWrt 增量编译只需 staging_dir(toolchain+产物)+.ccache，
      # 下次 run 恢复后只重编缺失包（约 20-40 分钟），避免失败=全量重编（约 2.5h）烧额度
      - name: Prune Old Cache
        if: ${{ !cancelled() && steps.skip.outputs.skip == 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          gh cache list --key "${{ matrix.model }}-${{ hashFiles('**/repo_flag') }}-" --json key --jq '.[].key' | while read -r key; do
            gh cache delete "$key" 2>/dev/null || true
          done

      - name: Save Cache (even on failure)
        if: ${{ !cancelled() && steps.skip.outputs.skip == 'false' }}
        continue-on-error: true
        uses: actions/cache/save@v4.2.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.model }}-${{ hashFiles('**/repo_flag') }}-${{ env.BUILD_DATE }}

      # ===== 云端自驱动链：成功→自动触发下一台；失败→自动重试（最多 3 次）=====
      - name: Dispatch Next Device (chain)
        if: ${{ success() && steps.skip.outputs.skip == 'false' && inputs.model != '' }}
        shell: bash
        run: |
          NEXT=""
          case "${{ matrix.model }}" in
            jdcloud_ipq60xx_immwrt)     NEXT="qihoo_360t7-nikki_immwrt" ;;
            qihoo_360t7-nikki_immwrt)   NEXT="qihoo_360t7-daed_immwrt" ;;
            qihoo_360t7-daed_immwrt)    NEXT="x64_immwrt" ;;
          esac
          if [ -n "$NEXT" ]; then
            echo "==> ${{ matrix.model }} 编译成功，链式触发下一台: $NEXT"
            gh workflow run daily-build.yml -f model="$NEXT" -f attempt=1 --repo "$GITHUB_REPOSITORY"
          else
            echo "==> 全部 4 台设备编译完成！本轮结束"
          fi

      - name: Auto Retry on Failure
        if: ${{ failure() && steps.skip.outputs.skip == 'false' && inputs.model != '' && inputs.attempt < '3' }}
        shell: bash
        run: |
          ATTEMPT=$(( ${{ inputs.attempt }} + 1 ))
          echo "==> ${{ matrix.model }} 编译失败 (attempt ${{ inputs.attempt }}/3)，自动重试，将走缓存增量续编"
          gh workflow run daily-build.yml -f model="${{ matrix.model }}" -f attempt="$ATTEMPT" --repo "$GITHUB_REPOSITORY"
